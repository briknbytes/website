# "website" matches the project name already created in the Cloudflare
# dashboard (Workers & Pages -> website) — Cloudflare's Git-connected build
# checks this against the dashboard project and offers to auto-PR a fix if
# they drift apart.
name = "website"
main = "worker/index.ts"
compatibility_date = "2024-09-25"

# Static Astro build. Any request matching a file here is served directly
# without invoking the Worker (default run_worker_first = false); anything
# else (in practice, only /api/*) falls through to worker/index.ts.
[assets]
directory = "./dist"
binding = "ASSETS"
