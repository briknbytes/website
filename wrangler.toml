# "website" matches the project name already created in the Cloudflare
# dashboard (Workers & Pages -> website) — Cloudflare's Git-connected build
# checks this against the dashboard project and offers to auto-PR a fix if
# they drift apart.
name = "website"
main = "worker/index.ts"
compatibility_date = "2024-09-25"

# Static Astro build. Any request matching a file here is served directly
# without invoking the Worker (default run_worker_first = false); anything
# else (in practice, only /api/*) falls through to worker/index.ts.
[assets]
directory = "./dist"
binding = "ASSETS"

# Non-secret config. `wrangler deploy` treats [vars] as the source of truth
# for plain (non-secret) variables and OVERWRITES anything set only via the
# dashboard with whatever is (or isn't) declared here — so these must live
# here, not just in the dashboard, or every CI deploy wipes them back to
# undefined. Safe to commit: a Discord OAuth client ID and a guild/server ID
# are public identifiers (same as any OAuth app's client ID), and the other
# two are just this site's own public URL.
#
# DISCORD_CLIENT_SECRET and SESSION_SECRET are NOT here — they stay as
# "Secret" runtime variables in the Cloudflare dashboard, which `wrangler
# deploy` does not touch (only plain `[vars]` get synced/overwritten).
[vars]
DISCORD_CLIENT_ID = "1550089943471358054"
DISCORD_GUILD_ID = "1536005397561745409"
DISCORD_REDIRECT_URI = "https://briknbytes.io/api/auth/callback"
SITE_URL = "https://briknbytes.io"

# Holds the actual recording/slides URLs, keyed by event slug — deliberately
# NOT in git (this repo is public). Set values via `wrangler kv key put` or
# the Cloudflare dashboard; see README's "Adding a recording" section.
# The namespace id itself isn't a secret (it doesn't grant access on its
# own), just replace the placeholder after creating the namespace:
#   wrangler kv namespace create EVENTS_KV
[[kv_namespaces]]
binding = "EVENTS_KV"
id = "9943b62ed34e44958628f81c9c36628a"
